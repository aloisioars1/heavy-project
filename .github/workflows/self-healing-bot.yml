name: Self-Healing CI Bot

on:
  workflow_run:
    workflows: ["Android CI/CD"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  healer:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Tenta corrigir erros conhecidos
        run: |
          FILE=".github/workflows/android.yml"
          if [! -f "$FILE" ]; then
            FILE=$(find.github/workflows -name "*.yml" | head -1)
          fi

          echo "Verificando $FILE"
          FIXED=false

          # Remove NODE_OPTIONS invalido
          if grep -q "NODE_OPTIONS" "$FILE"; then
            sed -i '/NODE_OPTIONS/d' "$FILE"
            sed -i '/env:/d' "$FILE"
            FIXED=true
          fi

          # Atualiza checkout v4 -> v5
          if grep -q "actions/checkout@v4" "$FILE"; then
            sed -i 's/actions\/checkout@v4.*/actions\/checkout@v5/' "$FILE"
            FIXED=true
          fi

          # Atualiza firebase v2 -> v13
          if grep -q "firebase-action@v2" "$FILE"; then
            sed -i 's/w9jds\/firebase-action@v2.*/w9jds\/firebase-action@v13.35.1/' "$FILE"
            FIXED=true
          fi

          echo "FIXED=$FIXED" >> $GITHUB_ENV
          echo "FILE=$FILE" >> $GITHUB_ENV

      - name: Cria PR com a correção
        if: env.FIXED == 'true'
        run: |
          git config user.name "ci-healer-bot"
          git config user.email "bot@healer.com"
          BRANCH="bot/fix-ci-$(date +%s)"
          git checkout -b $BRANCH
          git add ${{ env.FILE }}
          git commit -m "🤖 bot: corrige CI automaticamente"
          git push origin $BRANCH
          gh pr create --title "🤖 Bot: Correção automática do CI" --body "O bot detectou que o Android CI quebrou e corrigiu sozinho." --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
