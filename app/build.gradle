plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.heavy.studio'
    compileSdk 34

    defaultConfig {
        applicationId 'com.heavy.studio'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildCache {
        local {
            enabled = true
        }
    }

    signingConfigs {
        release {
            if (file("release.keystore").exists()) {
                storeFile file("release.keystore")
            } else {
                storeFile file("app/release.keystore")
            }
            storePassword System.getenv("KEYSTORE_STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEYSTORE_KEY_ALIAS") ?: "upload_key"
            keyPassword System.getenv("KEYSTORE_KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.security:security-crypto:1.1.0'
    kapt 'androidx.room:room-compiler:2.5.1'
}
